<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowledge Graph</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='7' fill='%23e8590c'/><circle cx='5' cy='7' r='3.5' fill='%231c7ed6'/><circle cx='27' cy='9' r='3.5' fill='%232f9e44'/><circle cx='24' cy='27' r='3.5' fill='%237048e8'/></svg>" />
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <h1 id="title">Knowledge Graph</h1>
        <p id="stats" class="muted"></p>
        <button id="chat-toggle" class="primary">💬 Chat with the graph</button>
      </header>

      <div class="search">
        <input id="search" type="search" placeholder="Search papers, topics, methods…" autocomplete="off" />
        <ul id="results" hidden></ul>
      </div>

      <section>
        <h2>Node types</h2>
        <ul id="legend"></ul>
      </section>

      <section>
        <h2>View</h2>
        <label class="row">Neighbourhood of selection
          <select id="hops">
            <option value="0">Whole graph</option>
            <option value="1">1 hop</option>
            <option value="2">2 hops</option>
          </select>
        </label>
        <label class="row"><input id="labels" type="checkbox" checked /> Show labels</label>
        <label class="row"><input id="arrows" type="checkbox" /> Show edge direction</label>
        <div class="buttons">
          <button id="focus-owner">Focus on me</button>
          <button id="fit">Fit to screen</button>
        </div>
      </section>

      <p class="muted small">Click a node for details · drag to pin · scroll to zoom · Esc clears selection.</p>
    </aside>

    <main id="stage">
      <div id="graph"></div>
      <section id="chat" hidden aria-label="Chat with the knowledge graph">
        <header>
          <strong>Ask the graph</strong>
          <span id="chat-status" class="muted">● checking…</span>
          <span class="spacer"></span>
          <button id="chat-clear" title="New conversation">New</button>
          <button id="chat-close" aria-label="Close chat">×</button>
        </header>
        <div id="chat-log"></div>
        <form id="chat-form">
          <div class="chat-meta">
            <span id="chat-focus" hidden></span>
            <label title="Let the model reason before answering (slower on CPU)"><input id="chat-think" type="checkbox" /> Reasoning</label>
          </div>
          <div class="chat-input-row">
            <textarea id="chat-input" rows="2" placeholder="Ask about papers, topics, methods… (Enter to send)"></textarea>
            <button id="chat-send" type="submit" class="primary">Send</button>
          </div>
        </form>
      </section>
    </main>

    <aside id="details" hidden>
      <button id="close-details" aria-label="Close details">×</button>
      <div id="details-content"></div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
